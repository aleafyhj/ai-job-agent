[project]
name = "ai-job-agent"
version = "0.1.0"
description = "AI job search and application service"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = ["httpx2", "pytest>=8,<10", "ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
